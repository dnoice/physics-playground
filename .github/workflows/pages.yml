#
# ✒ Changelog:
#     - 2.2.0 (11/09/2026) [dendogg + Anthropic - Claude Opus 5.5] — Created
#       on Dennis's direction to verify and harden the GitHub Pages build.
#
# ✒ Description:
#     Verifies every push and pull request (lint, project check, staged-site
#     check) and deploys the verified _site/ folder to GitHub Pages from
#     main. It deploys only when the repository's Pages source is "GitHub
#     Actions"; under "Deploy from a branch" it verifies and says so in the
#     job summary, so it never fails while the branch deploy is in charge.
#
# ✒ Key Features:
#     - One gate for every change: npm ci, npm run lint, npm run check and
#       npm run site, on Node 22 with the npm cache keyed to the lockfile.
#     - Deploys only the runtime files tools/site.mjs stages; tests, tools,
#       docs and package files never reach the public site.
#     - Reads the Pages source before deploying and explains what it did in
#       the run summary.
#     - Pull requests verify only; deploys run from main alone.
#     - Least privilege: read-only by default, pages and id-token write only
#       in the deploy job.
#     - Deploys never cancel one another; superseded pull request runs do.
#     - Every job has a timeout, so a hung step cannot hold the queue.
#
# ✒ Usage Instructions:
#     Runs by itself on push and pull request to main; run it by hand from
#     the Actions tab (workflow_dispatch). To let it deploy, set Settings →
#     Pages → Build and deployment → Source to "GitHub Actions" once.
#
# ✒ Other Important Information:
#     - Dependencies: actions/checkout@v7, actions/setup-node@v5,
#       actions/upload-pages-artifact@v3 and actions/deploy-pages@v5 (the
#       majors GitHub's own Pages build resolved on 11/09/2026), and the gh
#       CLI preinstalled on GitHub-hosted runners
#     - Compatible platforms: GitHub Actions, ubuntu-latest runners
#     - Local equivalent: npm ci && npm run verify
# ---------

name: Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Verify and stage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    outputs:
      source: ${{ steps.source.outputs.build_type }}
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install the dev tools
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Check headers, icons and syntax
        run: npm run check

      - name: Stage and verify the site
        run: npm run site

      - name: Read the Pages source
        id: source
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          build_type=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .build_type 2>/dev/null) || build_type=none
          echo "build_type=$build_type" >> "$GITHUB_OUTPUT"
          {
            echo "### GitHub Pages"
            case "$build_type" in
              workflow) echo "Source is **GitHub Actions**: the verified \`_site/\` folder is deployed by the next job." ;;
              legacy) echo "Source is **Deploy from a branch**: GitHub's own *pages build and deployment* run publishes this push, and this run verified it. To deploy only what passes these checks, set **Settings → Pages → Source** to **GitHub Actions**." ;;
              *) echo "Pages is not enabled for this repository, or its settings could not be read, so nothing was deployed. The site was verified." ;;
            esac
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the site
        if: steps.source.outputs.build_type == 'workflow' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.verify.outputs.source == 'workflow'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5

